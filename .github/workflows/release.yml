name: Release

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  auto-tag:
    name: Tag plugin version
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Create version tag when it is missing
        shell: bash
        run: |
          VERSION=$(grep -m1 "Version:" agent-role.php | sed -E 's/.*Version:[[:space:]]*//' | tr -d '\r')
          if [[ -z "${VERSION}" ]]; then
            echo "Plugin version header was not found."
            exit 1
          fi
          TAG="v${VERSION}"
          if git ls-remote --tags origin "refs/tags/${TAG}" | grep -q "${TAG}$"; then
            echo "Tag ${TAG} already exists."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag "${TAG}"
          git push origin "${TAG}"

  build-zip:
    name: Build plugin zip
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Determine version and package names
        id: vars
        shell: bash
        run: |
          RAW_VERSION="${GITHUB_REF#refs/tags/}"
          VERSION="${RAW_VERSION#v}"
          ZIP_NAME="agent-role-${VERSION}.zip"
          ROOT_DIR="agent-role"
          echo "raw_version=${RAW_VERSION}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "zip_name=${ZIP_NAME}" >> "$GITHUB_OUTPUT"
          echo "root_dir=${ROOT_DIR}" >> "$GITHUB_OUTPUT"

      - name: Generate changelog body
        id: changelog
        shell: bash
        env:
          RELEASE_VERSION: ${{ steps.vars.outputs.version }}
        run: |
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          if [[ -z "$PREV_TAG" ]]; then
            CHANGES=$(git log --pretty=format:"- %s (%h)" --no-merges)
          else
            CHANGES=$(git log "${PREV_TAG}..HEAD" --pretty=format:"- %s (%h)" --no-merges)
          fi
          if [[ -z "$CHANGES" ]]; then
            CHANGES="- No changes detected"
          fi
          NOTES_FILE="${RUNNER_TEMP}/release-notes.md"
          {
            echo "## Changes in v${RELEASE_VERSION}"
            echo
            echo "${CHANGES}"
          } > "${NOTES_FILE}"
          echo "notes_file=${NOTES_FILE}" >> "$GITHUB_OUTPUT"

      - name: Create ZIP package
        id: package
        shell: bash
        run: |
          mkdir -p /tmp/agent-role-release
          rsync -av --exclude-from=".distignore" ./ "/tmp/agent-role-release/${{ steps.vars.outputs.root_dir }}/"
          cd /tmp/agent-role-release
          zip -r "${GITHUB_WORKSPACE}/${{ steps.vars.outputs.zip_name }}" "${{ steps.vars.outputs.root_dir }}/"
          cd "${GITHUB_WORKSPACE}"
          if [[ ! -f "${{ steps.vars.outputs.zip_name }}" ]]; then
            echo "ZIP package was not created."
            exit 1
          fi
          echo "zip_path=${{ steps.vars.outputs.zip_name }}" >> "$GITHUB_OUTPUT"

      - name: Upload ZIP as workflow artifact
        uses: actions/upload-artifact@v5
        with:
          name: agent-role-${{ steps.vars.outputs.version }}
          path: ${{ steps.package.outputs.zip_path }}

      - name: Create or update GitHub release and attach ZIP
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.vars.outputs.raw_version }}"
          TITLE="${TAG#v}"
          NOTES_FILE="${{ steps.changelog.outputs.notes_file }}"
          ZIP_PATH="${{ steps.package.outputs.zip_path }}"
          if gh release view "${TAG}" >/dev/null 2>&1; then
            gh release edit "${TAG}" --notes-file "${NOTES_FILE}" --title "${TITLE}"
          else
            gh release create "${TAG}" --title "${TITLE}" --notes-file "${NOTES_FILE}"
          fi
          gh release upload "${TAG}" "${ZIP_PATH}" --clobber
